name: Deploy b2bit-func-app-web

on:
  push:
    branches:
      - Produccion
    paths:
      - 'b2bit-backend/**'
      - '.github/workflows/deploy-b2bit-func-app-web.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: b2bit-func-app-web
  AZURE_FUNCTIONAPP_PACKAGE_PATH: b2bit-backend
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"

      - name: Build and publish
        run: |
          dotnet publish "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" \
            --configuration Release \
            --output ./output

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
